- name: Update app
  hosts: all
  gather_facts: yes
  vars:
    # Tactic 1 (perf/predicciones.md P6): retries after an ARCA 5xx.
    # 0 = as measured in results/2-nodos-f1as. Override with:
    #   ./ansible/deploy.sh -e arca_retries=1
    arca_retries: 0
    # Tactic 2 (perf/predicciones.md P7): POST /exchange rate limit.
    # local = per node, in memory (as measured in results/2-nodos-f1as).
    # global = one counter in Redis for the whole system. Override with:
    #   ./ansible/deploy.sh -e rate_limit_mode=global -e exchange_rate_limit=1200
    rate_limit_mode: local
    exchange_rate_limit: 500
  tasks:
    - name: Stop old version
      command: pm2 delete app
      ignore_errors: yes
    - name: Extract new version
      unarchive:
        src: ../node/src.zip
        dest: ~/.
        owner: azureuser
        group: azureuser
    - name: Install dependencies
      command: npm install
    - name: Start new version
      command: pm2 start app.js --name app
      environment:
        ARCA_RETRIES: "{{ arca_retries }}"
        RATE_LIMIT_MODE: "{{ rate_limit_mode }}"
        EXCHANGE_RATE_LIMIT: "{{ exchange_rate_limit }}"